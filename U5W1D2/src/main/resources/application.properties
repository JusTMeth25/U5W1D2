spring.application.name=U5W1D2
spring.config.import=file:env.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/U5W1D2
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
# show-sql scrive su System.out e salta il framework di logging: le query
# passano dal logger di Hibernate (vedi logging.level.org.hibernate.SQL sotto).
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
server.port=3001
jwt.secret=${JWT_SECRET}

app.cors.allowed-origin=http://localhost:5173

# --- Logging ---
# Il formato delle righe e la rotazione stanno in logback-spring.xml.
logging.file.name=logs/u5w1d2.log
logging.level.root=INFO
logging.level.com.example.u5w1d2=INFO
# Ogni eccezione gestita da GlobalExceptionHandler verrebbe loggata due volte: qui e da Spring.
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR
# Query SQL: DEBUG in sviluppo, WARN in produzione (una riga per query e' troppo sotto carico).
logging.level.org.hibernate.SQL=DEBUG
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=200MB